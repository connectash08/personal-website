            <p>Let's Get In Touch!</p>

        <div class="container mt-4">
            <div class="alert alert-info topSwooshGeneral" role="alert">
                Please fill out the form below to send an email to my inbox.

                address any questions or inquires you might have as soon as

            </div>

        <div class="contactForm">
            <h2>Send An Email</h2>
            <form action="https://api.web3forms.com/submit" method="POST">
                <input type="hidden" name="access_key" value="5947e027-9f59-4d45-a473-877d56bb0c46">
                <div class="formComponent">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter name..." required>
                </div>
                <div class="formComponent">
                    <label for="email">Your Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter email address..." required>
                </div>
                <div class="formComponent">
                    <label for="message">Type Your Message Below</label>
                    <textarea id="message" name="message" required></textarea>
                </div>
                <button type="Submit">Send</button>
            </form>
        </div>
